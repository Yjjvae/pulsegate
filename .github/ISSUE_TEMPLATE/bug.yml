name: Bug report
description: 报告可复现的 PulseGate 缺陷
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么，预期行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小、完整、可复现的命令。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: OS、编译器、CMake、Boost 版本与 Commit。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      render: shell
