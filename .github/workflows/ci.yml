name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} debug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ ninja-build clang libboost-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build/ci-${{ matrix.compiler }} -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPULSEGATE_BUILD_TESTS=ON
          -DPULSEGATE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/ci-${{ matrix.compiler }} --parallel 2

      - name: Test
        run: ctest --test-dir build/ci-${{ matrix.compiler }} --output-on-failure

  asan-ubsan:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libboost-dev

      - name: Configure
        run: >
          cmake -S . -B build/ci-asan -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/clang-toolchain.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DPULSEGATE_BUILD_TESTS=ON
          -DPULSEGATE_WARNINGS_AS_ERRORS=ON
          -DPULSEGATE_ENABLE_ASAN=ON
          -DPULSEGATE_ENABLE_UBSAN=ON

      - name: Build
        run: cmake --build build/ci-asan --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/ci-asan --output-on-failure

  tsan:
    name: TSan (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libboost-dev

      - name: Configure
        run: >
          cmake -S . -B build/ci-tsan -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/clang-toolchain.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DPULSEGATE_BUILD_TESTS=ON
          -DPULSEGATE_WARNINGS_AS_ERRORS=ON
          -DPULSEGATE_ENABLE_TSAN=ON

      - name: Build
        run: cmake --build build/ci-tsan --parallel 2

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/ci-tsan --output-on-failure

  quality:
    name: Formatting and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang clang-format clang-tidy libboost-dev

      - name: Check formatting
        run: |
          git ls-files -z -- '*.cpp' '*.h' | \
            xargs -0 -r clang-format --dry-run --Werror

      - name: Configure compilation database
        run: >
          cmake -S . -B build/ci-clang-tidy -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/clang-toolchain.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DPULSEGATE_BUILD_TESTS=ON
          -DPULSEGATE_WARNINGS_AS_ERRORS=ON

      - name: Run clang-tidy
        run: |
          git ls-files -z -- 'app/*.cpp' 'src/*.cpp' 'tests/*.cpp' | \
            xargs -0 -r clang-tidy -p build/ci-clang-tidy --quiet

  docker-compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and start demo
        run: docker compose up --build -d

      - name: Verify routing and single-upstream failure
        run: |
          set -euo pipefail
          cleanup() {
            docker compose logs --no-color
            docker compose down --volumes
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/livez; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/api/first
          docker compose stop upstream-a
          sleep 8
          curl --fail --silent --show-error http://127.0.0.1:8080/api/after-upstream-a-stop
